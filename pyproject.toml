[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semidesign"
version = "0.3.0"
description = "2D/3D silicon process simulator for image-sensor pixels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
semidesign = "semidesign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semidesign = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
