name = "NMOS source/drain (As implant + anneal)"

[wafer]
background_dopant = "B"
background_conc = 1e16   # cm^-3, p-type substrate
depth_nm = 600
dx_nm = 0.5

# Screen oxide before implant
[[step]]
type = "oxidize"
ambient = "dry"
temp_c = 900
time_min = 30

[[step]]
type = "implant"
dopant = "As"
dose = 5e15        # cm^-2
energy_kev = 50

# Activation anneal
[[step]]
type = "anneal"
temp_c = 1000
time_min = 10
