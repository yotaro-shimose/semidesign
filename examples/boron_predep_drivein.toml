name = "Boron well: implant + drive-in in wet oxidation"

[wafer]
background_dopant = "P"
background_conc = 1e15   # cm^-3, n-type substrate
depth_nm = 3000
dx_nm = 2

[[step]]
type = "implant"
dopant = "B"
dose = 1e13
energy_kev = 30

[[step]]
type = "oxidize"
ambient = "wet"
temp_c = 1100
time_min = 60
