name = "CIS pixel photodiode (2D cross-section)"

# One 1.1 um pixel. The box edges are mirrors, so the half trench at each
# edge is half of the trench shared with the neighbouring pixel.
[grid]
width_nm = 1100
depth_nm = 3000
spacing_nm = 10
headroom_nm = 300

[substrate]
dopant = "B"
conc = 1e15          # lightly doped p-type silicon

# 1-4: deep trench isolation: etch, thermal liner on the side walls, oxide fill, polish
[[step]]
type = "etch"
depth_nm = 2500
openings = [[0, 50], [1050, 1100]]

[[step]]
type = "oxidize"
ambient = "dry"
temp_c = 1050
time_min = 30
note = "liner oxide on the trench side walls"

[[step]]
type = "deposit"
material = "oxide"
thickness_nm = 60
note = "fill the rest of the trench"

[[step]]
type = "planarize"
level_nm = 0

# 5-7: the n-type bucket that collects electrons, built from three energies
[[step]]
type = "implant"
dopant = "P"
dose = 1.5e12
energy_kev = 1200
openings = [[150, 950]]

[[step]]
type = "implant"
dopant = "P"
dose = 2e12
energy_kev = 500
openings = [[150, 950]]

[[step]]
type = "implant"
dopant = "P"
dose = 3e12
energy_kev = 150
openings = [[150, 950]]

# 8: thin p-type lid at the surface (keeps the bucket away from the surface)
[[step]]
type = "implant"
dopant = "B"
dose = 1e13
energy_kev = 10
openings = [[60, 900]]

# 9: n+ read-out node next to the bucket
[[step]]
type = "implant"
dopant = "As"
dose = 2e15
energy_kev = 30
openings = [[960, 1040]]

# 10: activation anneal (implant damage makes the first seconds count most)
[[step]]
type = "anneal"
temp_c = 1000
time_min = 0.5
