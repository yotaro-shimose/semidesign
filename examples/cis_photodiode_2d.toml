name = "CIS pixel photodiode (2D cross-section)"

# One pixel, 1.1 um wide, mirrored at both edges (neighbours are copies).
[grid]
width_nm = 1100
depth_nm = 3000
spacing_nm = 10
headroom_nm = 200

[substrate]
dopant = "B"
conc = 1e15          # lightly doped p-type silicon

# 1-3: deep trench between pixels (half of a 100 nm trench at each edge)
[[step]]
type = "etch"
depth_nm = 2500
openings = [[0, 50], [1050, 1100]]
note = "pixel isolation trench"

[[step]]
type = "deposit"
material = "oxide"
thickness_nm = 60
note = "fill the trench with oxide"

[[step]]
type = "planarize"
level_nm = 0
note = "polish back to the silicon surface"

# 4-5: the n-type "bucket" that collects electrons (deep + shallow implant)
[[step]]
type = "implant"
dopant = "P"
dose = 1.5e12
energy_kev = 600
openings = [[150, 950]]

[[step]]
type = "implant"
dopant = "P"
dose = 4e12
energy_kev = 200
openings = [[150, 950]]

# 6: thin p-type "lid" at the surface (suppresses electrons appearing in the dark)
[[step]]
type = "implant"
dopant = "B"
dose = 1e13
energy_kev = 10
openings = [[60, 900]]

# 7: n+ read-out node next to the bucket
[[step]]
type = "implant"
dopant = "As"
dose = 2e15
energy_kev = 30
openings = [[960, 1040]]

# 8: activation anneal
[[step]]
type = "anneal"
temp_c = 1000
time_min = 1
